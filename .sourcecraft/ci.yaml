on:
  pull_request:
    - workflows: [signatures, quality]
      filter:
        target_branches: [main]

workflows:
  signatures:
    inputs:
      VALIDATION_BASE:
        type: string
        default: ''
      VALIDATION_PR:
        type: string
        default: ''
    env:
      VALIDATION_BASE: ${{ inputs.VALIDATION_BASE }}
      VALIDATION_PR: ${{ inputs.VALIDATION_PR }}
    checkout:
      fetch_depth: 0
      remove_credentials: true
    settings:
      max_cube_duration: 5m
    tasks:
      - name: developer-signatures
        cubes:
          - name: verify
            script:
              - |
                set -eu
                base="${SOURCECRAFT_BASE_SHA:-${VALIDATION_BASE:-}}"
                pr="${SOURCECRAFT_PR_SLUG:-${VALIDATION_PR:-}}"
                test -n "$base" && test -n "$pr"
                head="$(git rev-parse HEAD^{commit})"
                trusted="$(mktemp -d)"
                trap 'rm -rf "$trusted"' EXIT
                git show "$base:.ci/verify_commit_signatures.py" > "$trusted/verify.py"
                git show "$base:.ci/allowed_signers" > "$trusted/allowed_signers"
                python3 "$trusted/verify.py" --base "$base" --head "$head" \
                  --signers "$trusted/allowed_signers" \
                  --sourcecraft-repo tessera-labs/census --sourcecraft-api \
                  --sourcecraft-pr "$pr"

  quality:
    settings:
      max_cube_duration: 30m
    checkout:
      fetch_depth: 0
      remove_credentials: true
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '4'
    tasks:
      - name: rust-checks
        cubes:
          - name: install-rust
            script:
              - |
                set -eu
                curl --proto '=https' --tlsv1.2 -fsSL \
                  https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                  -o /tmp/rustup-init
                echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum -c -
                chmod +x /tmp/rustup-init
                /tmp/rustup-init -y --profile minimal --default-toolchain stable
                export PATH="$HOME/.cargo/bin:$PATH"
                rustup component add rustfmt clippy
          - name: rustfmt
            script:
              - export PATH="$HOME/.cargo/bin:$PATH"; cargo fmt --all --check
          - name: test
            script:
              - |
                set -eu
                export PATH="$HOME/.cargo/bin:$PATH"
                cargo test --locked
                cargo test --features schema --locked
          - name: clippy
            script:
              - |
                set -eu
                export PATH="$HOME/.cargo/bin:$PATH"
                cargo clippy --all-targets --locked
                cargo clippy --all-targets --all-features --locked
      - name: cargo-deny
        cubes:
          - name: cargo-deny
            action: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
            with:
              command: check
      - name: taplo
        cubes:
          - name: validate-schemas
            script:
              - |
                set -eu
                tools="$SOURCECRAFT_ROOT_DIRECTORY/census-tools"
                mkdir -p "$tools"
                curl --proto '=https' --tlsv1.2 -fsSL \
                  https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-full-linux-x86_64.gz \
                  -o "$tools/taplo.gz"
                echo "71d655dc3f69ce30454cfade92fdbe846c0ba4aa3afa68f3ff0d216966d0d3c2  $tools/taplo.gz" | sha256sum -c -
                gzip -dc "$tools/taplo.gz" > "$tools/taplo"
                chmod +x "$tools/taplo"
                "$tools/taplo" --version
                "$tools/taplo" check

  bootstrap-proof:
    inputs:
      BOOTSTRAP_BASE:
        type: string
        required: true
      BOOTSTRAP_PR:
        type: string
        required: true
    env:
      BOOTSTRAP_BASE: ${{ inputs.BOOTSTRAP_BASE }}
      BOOTSTRAP_PR: ${{ inputs.BOOTSTRAP_PR }}
    checkout:
      fetch_depth: 0
      remove_credentials: true
    settings:
      max_cube_duration: 5m
    tasks:
      - name: frozen-bootstrap-signatures
        cubes:
          - name: verify
            script:
              - |
                set -eu
                echo "eba7db57ea48899add40ff0e1a65b42eabce648c2bf7c16e7519d96aadb05b59  .ci/verify_commit_signatures.py" | sha256sum -c -
                echo "24d2672b8afc366f5013be40de697e90c7015c2a04487388187c5c988f6ac6e1  .ci/allowed_signers" | sha256sum -c -
                head="$(git rev-parse HEAD^{commit})"
                python3 .ci/verify_commit_signatures.py --base "$BOOTSTRAP_BASE" --head "$head" \
                  --signers .ci/allowed_signers --sourcecraft-repo tessera-labs/census \
                  --sourcecraft-api --sourcecraft-pr "$BOOTSTRAP_PR"
